# =============================================================================
# Option B (HYBRID) — Tauri on macOS + Electron on Windows and Linux
# -----------------------------------------------------------------------------
# This is the split you asked about. It WILL build, but only after you add a
# real src-tauri/ Rust project to the repo (see TAURI_MIGRATION_CHECKLIST.md).
#
# IMPORTANT consequence for Surf FED specifically:
#   Tauri on macOS uses WKWebView (WebKit/Safari). It has no <webview> tag and
#   no Chrome extension runtime, so session.loadExtension() cannot be ported.
#   On macOS your built-in extensions (ad-blocker, dark-reader, fed-gram,
#   page-info) WILL NOT RUN. Windows/Linux keep full Electron + extensions.
#
#   Use this only if you accept a feature-reduced macOS build, or plan to
#   reimplement extensions natively in Rust.
#
# Prerequisites before this job can pass on macOS:
#   1. `npm install -D @tauri-apps/cli` and `npx tauri init` committed.
#   2. A "tauri" script in package.json: { "scripts": { "tauri": "tauri" } }.
#   3. src-tauri/tauri.conf.json build.beforeBuildCommand / frontendDist set
#      to a web-asset folder (NOT the Electron dist/ installer folder).
#   4. Tab/webview + IPC logic ported (see checklist).
# =============================================================================

name: Build Desktop Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate-extensions:
    name: Validate built-in extensions
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifests
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d extensions/builtin ]; then
            echo "No builtin extensions folder found."
            exit 0
          fi
          ok=1
          for dir in extensions/builtin/*/; do
            if [ ! -f "${dir}manifest.json" ]; then
              echo "::error::Missing manifest.json in $dir"
              ok=0
              continue
            fi
            if ! node -e "JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8'))" 2>/dev/null; then
              echo "::error::Invalid JSON in ${dir}manifest.json"
              ok=0
              continue
            fi
            name=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).name || 'unknown')")
            ver=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).version || '0')")
            echo "OK: $name v$ver ($dir)"
          done
          [ "$ok" = "1" ] || exit 1

  build-electron:
    name: Electron (${{ matrix.name }})
    needs: validate-extensions
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            dist_flags: --win
            artifact_name: Surf-FED-Windows
            artifact_globs: |
              dist/*.exe
              dist/latest*.yml
          - name: Linux
            os: ubuntu-24.04
            dist_flags: --linux
            artifact_name: Surf-FED-Linux
            artifact_globs: |
              dist/*.AppImage
              dist/*.deb
              dist/*.snap
              dist/latest*.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xauth \
            libavcodec-extra \
            libgbm1 \
            libasound2t64

      - name: Build Electron package
        run: npm run dist -- ${{ matrix.dist_flags }} --publish never

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_globs }}
          if-no-files-found: error
          retention-days: 30

  build-tauri-macos:
    name: Tauri (macOS)
    needs: validate-extensions
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # NOTE: For public distribution, sign + notarize here using
      # APPLE_CERTIFICATE / APPLE_ID secrets and tauri's signing config.
      - name: Build Tauri macOS package
        run: npm run tauri build -- --bundles dmg

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Surf-FED-macOS-Tauri
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - build-electron
      - build-tauri-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \
            \( \
              -name '*.exe' -o \
              -name '*.dmg' -o \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.snap' -o \
              -name 'latest*.yml' \
            \) \
            -exec cp {} release/ \;
          echo "Release files:"
          ls -lah release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Surf FED ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
